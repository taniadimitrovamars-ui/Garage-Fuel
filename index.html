html,body{margin:0;background:var(--bg);color:var(--t);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow-x:hidden}
body{padding:var(--sat) 0 calc(2.4rem + env(safe-area-inset-bottom,0))}
header{position:sticky;top:0;z-index:10;background:#0b1220f5;backdrop-filter:blur(8px);border-bottom:1px solid var(--b);padding:calc(var(--sat) + 8px) 14px 8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
header:after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,#009ada,#10b981,#f59e0b)}

button,select,input{font:inherit;color:var(--t)}
button,.btn{min-height:42px;padding:0 13px;border-radius:12px;border:1px solid #334155;background:#1e293b;cursor:pointer;touch-action:manipulation;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
button.on{background:#009ada33;border-color:var(--a);color:#7dd3fc}
button.pri,.btn.pri{background:var(--a);border-color:var(--a);color:#fff;font-weight:600}
button.ok{background:#10b98128;border-color:#10b98188;color:#6ee7b7}
button.sm{min-height:34px;padding:0 10px;font-size:12px}
input,select{width:100%;min-height:42px;background:#050810;border:1px solid #334155;border-radius:12px;padding:8px 11px}
label.k{display:block;font-size:11px;color:var(--m);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.card{background:var(--p);border:1px solid var(--b);border-radius:16px;padding:13px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.sp{justify-content:space-between}
.grid{display:grid;gap:10px}.g2{grid-template-columns:1fr}.g3{grid-template-columns:repeat(3,1fr)}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}}

<script>
window.addEventListener('error',function(ev){
  var app=document.getElementById('app');
  if(app&&app.textContent.indexOf('Зареждане')!==-1){
    app.innerHTML='<div class="card"><b>Грешка при стартиране:</b><div class="m" style="margin-top:6px">'+(ev.message||'Неизвестна грешка')+'</div></div>';
  }
});
(()=>{
'use strict';
const KEY='garage_fuel_pwa_v6';
const $=s=>document.querySelector(s);
const E=v=>String(v??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const DEFAULT_CHAINS=['OMV','Shell','Lukoil','Petrol','Eco','Круиз'];
const PRESET_PARTS=[
  {type:'Масло двигател',interval:10000,months:12,hint:'Напр. 5W-30 LL-04 или марка/артикул'},
  {type:'Маслен филтър',interval:10000,months:12,hint:'Напр. Mann / Bosch / OEM'},
  {type:'Въздушен филтър',interval:15000,months:18,hint:'Марка или код на филтъра'},
  {type:'Филтър купе',interval:15000,months:12,hint:'Поленов / активен въглен'},
  {type:'Трансмисионно масло',interval:60000,months:48,hint:'Скоростна кутия / диференциал / раздатка'},
  {type:'Спирачна течност / накладки',interval:30000,months:24,hint:'DOT 4 / предни / задни'}
];

function makeVehicle(name,plate,odo,photo){
  return{
    id:'v_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
    name:name||'Основно МПС',
    plate:plate||'',
    odo:Number(odo)||0,
    egn:'',
    regCert:'',
    photo:photo||'',
    services:[]
  };
}

let S={
  tab:'svc',
  activeVehId:'',
  vehicles:[makeVehicle('Основно МПС','',0,'')],
  fuels:DEFAULT_CHAINS.map((name,i)=>({id:'f_'+i+'_'+Date.now(),name,number:'',note:'',image:''})),
  form:{type:'Масло двигател',detail:'',km:'',interval:10000,months:12,date:new Date().toISOString().slice(0,10),note:''},
  ocrBusy:'',
  editVehId:null,
  editVehPhoto:'',
  editFuelId:null,
  editFuelImage:'',
  showFuelId:null,
  brightCard:false,
  zoomCard:false
};
S.activeVehId=S.vehicles[0].id;

let tt;
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',4200)};

function openDlg(dlg){
  if(!dlg)return;
  if(typeof dlg.showModal==='function'){
    try{dlg.showModal();return;}catch(e){}
  }
  dlg.setAttribute('open','');
}
function closeDlg(dlg){
  if(!dlg)return;
  if(typeof dlg.close==='function'){
    try{dlg.close();}catch(e){}
  }
  dlg.removeAttribute('open');
}

function getVeh(){
  return S.vehicles.find(v=>v.id===S.activeVehId)||S.vehicles[0];
}

function load(){
  try{
    const raw=localStorage.getItem(KEY)||localStorage.getItem('garage_fuel_pwa_v5')||localStorage.getItem('garage_fuel_pwa_v4')||localStorage.getItem('garage_fuel_pwa_v3')||localStorage.getItem('garage_fuel_pwa_v2')||localStorage.getItem('garage_fuel_pwa_v1');
    if(!raw)return;
    const d=JSON.parse(raw);
    if(Array.isArray(d.vehicles)&&d.vehicles.length){
      S.vehicles=d.vehicles.map(v=>({
        id:v.id||('v_'+Math.random().toString(36).slice(2,6)),
        name:v.name||'Основно МПС',
        plate:v.plate||'',
        odo:Number(v.odo)||0,
        egn:v.egn||'',
        regCert:v.regCert||'',
        photo:v.photo||'',
        services:Array.isArray(v.services)?v.services:[]
      }));
      S.activeVehId=d.activeVehId&&S.vehicles.some(v=>v.id===d.activeVehId)?d.activeVehId:S.vehicles[0].id;
    }else{
      const base=makeVehicle(d.vehicle||'Основно МПС',d.plate||'',Number(d.odo)||0,d.vehiclePhoto||'');
      base.egn=d.egn||'';
      base.regCert=d.regCert||'';
      base.services=Array.isArray(d.services)?d.services:[];
      S.vehicles=[base];
      S.activeVehId=base.id;
    }
    if(Array.isArray(d.fuels)&&d.fuels.length){
      S.fuels=d.fuels.map(f=>({id:f.id||('f_'+Math.random()),name:f.name||'',number:f.number||'',note:f.note||'',image:f.image||''}));
    }
    const cur=getVeh();
    S.form.km=cur.odo?String(cur.odo):'';
  }catch(e){}
}

function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify({
      activeVehId:S.activeVehId,
      vehicles:S.vehicles,
      fuels:S.fuels
    }));
  }catch(e){
    toast('Паметта за снимки е пълна — махни някоя снимка или запази по-малка.');
  }
}

/* ---------- Свиване на снимки в паметта ---------- */
function compressImage(file,maxSide,quality){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      try{
        let {width:w,height:h}=img;
        if(w>maxSide||h>maxSide){
          if(w>=h){h=Math.round(h*(maxSide/w));w=maxSide;}
          else{w=Math.round(w*(maxSide/h));h=maxSide;}
        }
        const cv=document.createElement('canvas');
        cv.width=w;cv.height=h;
        const ctx=cv.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        URL.revokeObjectURL(url);
        resolve(cv.toDataURL('image/jpeg',quality));
      }catch(err){
        URL.revokeObjectURL(url);
        reject(err);
      }
    };
    img.onerror=()=>{
      URL.revokeObjectURL(url);
      reject(new Error('image_load_error'));
    };
    img.src=url;
  });
}

function setCardEditorPreview(dataUrl){
  S.editFuelImage=dataUrl||'';
  const wrap=$('#cPreviewWrap');

/* ---------- Календар (ICS напомняне след N месеца) ---------- */
function addMonthsIso(dateStr,months){
  const base=dateStr?new Date(dateStr+'T09:00:00'):new Date();
  if(Number.isNaN(base.getTime()))return new Date();
  const d=new Date(base.getTime());
  d.setMonth(d.getMonth()+(Number(months)||12));
  return d;
}
function fmtCalDate(d){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  return `${y}${m}${day}`;
}
function fmtReadableDate(d){
  return d.toISOString().slice(0,10);
}
function buildIcsReminder({title,desc,targetDate}){
  const start=fmtCalDate(targetDate);
  const nextDay=new Date(targetDate.getTime()+86400000);
  const end=fmtCalDate(nextDay);
  const uid=`garage-${Date.now()}-${Math.random().toString(36).slice(2,7)}@garage-pwa`;
  const esc=s=>String(s||'').replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');
  return[
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Garage Fuel PWA//BG',
    'BEGIN:VEVENT',
    `UID:${uid}`,
    `DTSTART;VALUE=DATE:${start}`,
    `DTEND;VALUE=DATE:${end}`,
    `SUMMARY:${esc(title)}`,
    `DESCRIPTION:${esc(desc)}`,
    'END:VEVENT',
    'END:VCALENDAR'
  ].join('\r\n');
}
function triggerCalendarReminder(opts){
  const ics=buildIcsReminder(opts);
  const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='smyana-konsumativ-napomnyane.ics';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  toast(`Напомняне за ${fmtReadableDate(opts.targetDate)} е подготвено за календара.`);
}

/* ---------- OCR в паметта ---------- */
async function readImage(file,mode){
  if(!file)return;
  if(!window.Tesseract){
    toast('OCR библиотеката не е заредена — попълни ръчно.');
    return;
  }
  const cur=getVeh();
  S.ocrBusy=mode==='part'?'Разчитам етикета от снимката...':mode==='card'?'Разчитам номера от скрийншота...':'Разчитам километрите от снимката...';
  if(mode!=='card')render();
  else toast(S.ocrBusy);
  let url='';
  try{
    url=URL.createObjectURL(file);
    const {data}=await Tesseract.recognize(url,'eng+bul');
    const txt=(data.text||'').replace(/\s+/g,' ').trim();
    if(!txt){toast('Не се разчете ясен текст — опитай пак или попълни ръчно.');return;}
    if(mode==='part'){
      const picked=txt.slice(0,90);
      S.form.detail=S.form.detail?(S.form.detail+' · '+picked):picked;
      toast('Разчетено от етикета. Можеш да изтриеш снимката от галерията.');
    }else if(mode==='card'){
      const candidate=(txt.match(/[A-Z0-9][A-Z0-9\s-]{4,28}/gi)||[])[0]?.trim()||txt.slice(0,28);
      $('#cNum').value=candidate;
      toast('Разчетено от скрийншота. Провери и запази картата.');
    }else{
      const nums=(data.text||'').match(/\d[\d\s.,]{2,8}\d/g)||[];
      const cleanNums=nums.map(x=>Number(x.replace(/[^\d]/g,''))).filter(n=>n>=100&&n<=2000000);
      if(cleanNums.length){
        const best=cur.odo>0
          ? cleanNums.reduce((a,b)=>Math.abs(b-cur.odo)<Math.abs(a-cur.odo)?b:a)
          : Math.max(...cleanNums);
        S.form.km=String(best);
        toast('Разпознат пробег: '+best+' km. Снимката не се пази.');
      }else{
        toast('Не открих ясни цифри за пробег — въведи ги ръчно.');
      }
    }
  }catch(e){
    toast('Проблем при разчитането на снимката.');
  }finally{
    if(url)URL.revokeObjectURL(url);
    S.ocrBusy='';
    if(mode!=='card')render();
  }
}

/* ---------- Консумативи, профили и проверки (ГО, винетка, КАТ) ---------- */
function lastByType(veh,type){
  return (veh.services||[]).filter(x=>x.type===type).sort((a,b)=>(b.km||0)-(a.km||0))[0]||null;
}

function vServices(){
  const veh=getVeh();
  const curKm=Number(veh.odo)||0;
  const preset=PRESET_PARTS.find(p=>p.type===S.form.type)||PRESET_PARTS[0];
  const dueDate=addMonthsIso(S.form.date,S.form.months||12);
  const plateClean=encodeURIComponent((veh.plate||'').trim().toUpperCase());

  const profileChips=S.vehicles.map(v=>{
    const active=v.id===veh.id;
    return`<button type="button" class="sm ${active?'on':''}" data-switch-veh="${E(v.id)}">
      ${v.photo?`<img src="${v.photo}" class="veh-thumb" alt="">`:'🚗'}
      <span>${E(v.name)}${v.plate?` · <span class="mono">${E(v.plate)}</span>`:''}</span>
    </button>`;
  }).join('');

  const cards=PRESET_PARTS.map(p=>{
    const last=lastByType(veh,p.type);
    const inter=Number(last?.interval||p.interval||10000);
    const months=Number(last?.months||p.months||12);
    const nextKm=last?(Number(last.km)||0)+inter:null;
    const rem=nextKm!=null&&curKm>0?nextKm-curKm:null;
    let st='<span class="m">Няма записана смяна</span>';
    if(last){
      const remTxt=rem==null?'':rem<0
        ?`<span class="bad"> · просрочено с ${Math.abs(rem).toLocaleString()} km</span>`
        :rem<=1000?`<span class="mid"> · остават ${rem.toLocaleString()} km</span>`
        :`<span class="good"> · остават ${rem.toLocaleString()} km</span>`;
      st=`<b>${Number(last.km||0).toLocaleString()} km</b> <span class="m">(${E(last.date||'')})</span>${remTxt}`;
    }
    return`<div class="item" style="margin:0">
      <div class="row sp"><b>${E(p.type)}</b><button type="button" class="sm" data-pick-type="${E(p.type)}" data-pick-int="${inter}" data-pick-months="${months}">+ Смяна</button></div>
      <div style="margin-top:4px">${st}</div>
      <div class="m" style="margin-top:2px">${E(last?.detail||'Няма въведен продукт')}</div>
    </div>`;
  }).join('');

  const hist=(veh.services||[]).length?(veh.services||[]).map(s=>{
    const mInt=Number(s.months)||12;
    const remDate=addMonthsIso(s.date,mInt);
    return`
    <div class="item">
      <div class="row sp">
        <div><b>${E(s.type)}</b> · <span class="mono">${Number(s.km||0).toLocaleString()} km</span></div>
        <span class="m mono">${E(s.date||'')}</span>
      </div>
      <div style="margin-top:4px">${E(s.detail||'—')}</div>
      ${s.note?`<div class="m" style="margin-top:2px">${E(s.note)}</div>`:''}
      <div class="row" style="margin-top:8px">
        <button type="button" class="sm" data-cal-svc="${E(s.id)}">📅 Напомни след ${mInt} мес. (${fmtReadableDate(remDate)})</button>
        <button type="button" class="sm" data-del-svc="${E(s.id)}">Изтрий запис</button>
      </div>
    </div>`;
  }).join(''):`<p class="m">Все още няма записани смени за този профил.</p>`;

  return`
  <div class="card">
    <div class="row sp" style="margin-bottom:8px">
      <div>
        <h3 style="margin:0">Профили на превозни средства</h3>
        <div class="m">Данните се пазят за всеки профил поотделно — сменяш с едно натискане.</div>
      </div>
      <div class="row">
        <button type="button" class="sm" id="editVehBtn">Редактирай</button>
        <button type="button" class="pri sm" id="addVehBtn">+ Нов профил</button>
      </div>
    </div>
    <div class="row" style="margin-bottom:10px">${profileChips}</div>
    ${veh.photo?`<img src="${veh.photo}" class="veh-photo" style="margin-bottom:10px" alt="${E(veh.name)}">`:''}
    <div class="grid g3">
      <div>
        <label class="k">Текущ профил</label>
        <input id="vehInput" value="${E(veh.name)}" placeholder="Напр. 330i xDrive / Raptor 350">
      </div>
      <div>
        <label class="k">Рег. номер</label>
        <input id="plateInput" class="mono" value="${E(veh.plate)}" placeholder="Напр. PB1234AB">
      </div>
      <div>
        <label class="k">Текущ пробег (km)</label>
        <input id="odoInput" type="number" inputmode="numeric" value="${veh.odo||''}" placeholder="Напр. 118500">
      </div>
    </div>
    <div class="grid g2" style="margin-top:8px">
      <div>
        <label class="k">ЕГН / Булстат (запазва се за КАТ)</label>
        <input id="egnInput" class="mono" value="${E(veh.egn)}" placeholder="За бърза проверка на глоби">
      </div>
      <div>
        <label class="k">№ СРМПС / талон (запазва се за КАТ)</label>
        <input id="regCertInput" class="mono" value="${E(veh.regCert)}" placeholder="Номер на свидетелство за регистрация">
      </div>
    </div>
    <div class="m" style="margin-top:8px">Снимките при смяна се обработват само временно за OCR и не се пазят — след запис можеш да ги изтриеш от галерията.</div>
  </div>

  <div class="card">
    <div class="row sp" style="margin-bottom:8px">
      <div>
        <h3 style="margin:0">Проверки: застраховка, винетка и КАТ</h3>
        <div class="m">Запазените рег. номер, ЕГН и № СРМПС остават в профила — не ги въвеждаш повторно.</div>
      </div>
      ${(veh.plate||veh.egn||veh.regCert)?`<button type="button" class="sm" id="copyCheckInfo">Копирай данните</button>`:''}
    </div>
    <div class="grid g3">
      <div class="item" style="margin:0">
        <b>Гражданска отговорност</b>
        <div class="m" style="margin:4px 0 8px">Проверка по рег. номер във Гаранционен фонд.</div>
        <a class="btn sm pri" target="_blank" rel="noopener" href="https://www.guarantee.bg/bg/citizens/check-for-valid-insurance${plateClean?`?plate=${plateClean}`:''}">Отвори проверка</a>
      </div>
      <div class="item" style="margin:0">
        <b>Електронна винетка</b>
        <div class="m" style="margin:4px 0 8px">Проверка за валидност по рег. номер и държава.</div>
        <a class="btn sm pri" target="_blank" rel="noopener" href="https://bgtoll.bg/bg/elektronni-vinetki">Отвори BGTOLL</a>
      </div>
      <div class="item" style="margin:0">
        <b>Глоби и фишове КАТ</b>
        <div class="m" style="margin:4px 0 8px">Портал на МВР за електронни фишове и НП.</div>
        <a class="btn sm pri" target="_blank" rel="noopener" href="https://e-uslugi.mvr.bg/services/obligations">Отвори МВР КАТ</a>
      </div>
    </div>
  </div>

  <div class="card">
    <h3 style="margin:0 0 10px">Нова смяна на консуматив</h3>
    ${S.ocrBusy?`<div class="item" style="border-color:#009ada88"><b class="good">${E(S.ocrBusy)}</b></div>`:''}
    <div class="grid g2">
      <div>
        <label class="k">Консуматив</label>
        <select id="fType">
          ${PRESET_PARTS.map(p=>`<option value="${E(p.type)}"${S.form.type===p.type?' selected':''}>${E(p.type)}</option>`).join('')}
        </select>
      </div>
      <div>
        <label class="k">Километри при смяната</label>
        <div class="row">
          <input id="fKm" type="number" inputmode="numeric" style="flex:1" value="${E(S.form.km)}" placeholder="km">
          <label class="btn sm" title="Снимай километраж">
            📷 Километри
            <input type="file" accept="image/*" capture="environment" data-ocr="km" hidden>
          </label>
        </div>
      </div>
    </div>

    <div style="margin-top:10px">
      <label class="k">Масло / филтър / част (разпознато или ръчно)</label>
      <div class="row">
        <input id="fDetail" style="flex:1" value="${E(S.form.detail)}" placeholder="${E(preset.hint)}">
        <label class="btn sm" title="Снимай етикет / продукт">
          📷 Етикет
          <input type="file" accept="image/*" capture="environment" data-ocr="part" hidden>
        </label>
      </div>
    </div>

    <div class="grid g3" style="margin-top:10px">
      <div>
        <label class="k">Интервал (km)</label>
        <input id="fInt" type="number" inputmode="numeric" value="${E(S.form.interval)}">
      </div>
      <div>
        <label class="k">Напомняне след (мес.)</label>
        <input id="fMonths" type="number" inputmode="numeric" min="1" max="120" value="${E(S.form.months)}">
      </div>
      <div>
        <label class="k">Дата на смяна</label>
        <input id="fDate" type="date" value="${E(S.form.date)}">
      </div>
    </div>

    <div style="margin-top:10px">
      <label class="k">Бележка (по желание)</label>
      <input id="fNote" value="${E(S.form.note)}" placeholder="Напр. количество литри, сервиз, забележка">
    </div>

    <div class="row sp" style="margin-top:12px">
      <div class="row">
        <button type="button" class="pri" id="saveSvc">Запази смяната</button>
        <button type="button" class="ok" id="addCalForm">📅 Напомни на ${fmtReadableDate(dueDate)}</button>
      </div>
      <button type="button" class="sm" id="clearForm">Изчисти полетата</button>
    </div>
  </div>

  <div class="card">
    <h3 style="margin:0 0 10px">Състояние на консумативите (${E(veh.name)})</h3>
    <div class="grid g2">${cards}</div>
  </div>

  <div class="card">
    <div class="row sp" style="margin-bottom:8px">
      <h3 style="margin:0">История на смените (${(veh.services||[]).length})</h3>
      <div class="row">
        <button type="button" class="sm" id="btnExport">Експорт JSON</button>
        <label class="btn sm">Импорт<input type="file" id="fileImport" accept="application/json,.json" hidden></label>
      </div>
    </div>
    ${hist}
  </div>`;
}

/* ---------- Карти за отстъпка ---------- */
function vFuel(){
  const tiles=S.fuels.map(f=>{
    const hasNum=!!(f.number&&f.number.trim());
    const hasImg=!!f.image;
    const ready=hasNum||hasImg;
    return`<div class="fuel-tile ${ready?'has':''}" data-open-fuel="${E(f.id)}">
      <div class="row sp">
        <b>${E(f.name)}</b>
        <span class="m">${ready?(hasImg?'Карта + '+(hasNum?'№':'визуална'):'Готова'):'Без карта'}</span>
      </div>
      <div class="mono" style="margin-top:6px;font-size:15px;color:${ready?'#7dd3fc':'var(--m)'}">
        ${hasNum?E(f.number):(hasImg?'Натисни за голям изглед на картата':'Натисни за въвеждане на карта')}
      </div>
      ${hasImg?`<img src="${f.image}" class="card-shot" style="max-height:140px;min-height:80px;margin:8px 0 0" alt="${E(f.name)}">`:''}
      ${f.note?`<div class="m" style="margin-top:4px">${E(f.note)}</div>`:''}
    </div>`;
  }).join('');

  return`
  <div class="card">
    <div class="row sp" style="margin-bottom:8px">
      <div>
        <h3 style="margin:0">Карти за отстъпка</h3>
        <div class="m">Картите се отварят уголемени с ярък фон за по-лесно сканиране на касата.</div>
      </div>
      <button type="button" class="pri sm" id="addFuel">+ Нова карта</button>
    </div>
    <div class="grid g2">${tiles}</div>
  </div>`;
}

function render(){
  $('#tabSvc').className=S.tab==='svc'?'on':'';
  $('#tabFuel').className=S.tab==='fuel'?'on':'';
  $('#app').innerHTML=S.tab==='svc'?vServices():vFuel();
}

function syncFormFromDom(){
  const veh=getVeh();
  const v=$('#vehInput');if(v)veh.name=v.value.trim()||'Основно МПС';
  const pl=$('#plateInput');if(pl)veh.plate=pl.value.trim().toUpperCase();
  const o=$('#odoInput');if(o&&o.value!=='')veh.odo=Math.max(0,Number(o.value)||0);
  const eg=$('#egnInput');if(eg)veh.egn=eg.value.trim();
  const rc=$('#regCertInput');if(rc)veh.regCert=rc.value.trim();
  const ft=$('#fType');if(ft)S.form.type=ft.value;
  const fk=$('#fKm');if(fk)S.form.km=fk.value;
  const fd=$('#fDetail');if(fd)S.form.detail=fd.value;
  const fi=$('#fInt');if(fi)S.form.interval=Number(fi.value)||10000;
  const fm=$('#fMonths');if(fm)S.form.months=Math.max(1,Number(fm.value)||12);
  const fdt=$('#fDate');if(fdt)S.form.date=fdt.value;
  const fn=$('#fNote');if(fn)S.form.note=fn.value;
}

function openVehEditor(id){
  syncFormFromDom();
  const item=id?S.vehicles.find(v=>v.id===id):null;
  S.editVehId=item?item.id:null;
  $('#vDlgTitle').textContent=item?'Редакция на профил':'Нов профил на МПС';
  $('#vName').value=item?item.name:'';
  $('#vPlate').value=item?item.plate:'';
  $('#vOdo').value=item&&item.odo?String(item.odo):'';
  $('#vEgn').value=item?item.egn:'';
  $('#vRegCert').value=item?item.regCert:'';
  $('#vDel').style.display=item&&S.vehicles.length>1?'':'none';
  setVehPhotoPreview(item?item.photo:'');
  openDlg($('#vehDlg'));
}

function openCardEditor(id){
  S.editFuelId=id||null;
  const item=S.fuels.find(x=>x.id===id);
  $('#cTitle').textContent=item?'Редакция на карта':'Нова карта за отстъпка';
  $('#cName').value=item?item.name:'';
  $('#cNum').value=item?item.number:'';
  $('#cNote').value=item?item.note:'';
  $('#cDel').style.display=item?'':'none';
  setCardEditorPreview(item?item.image:'');
  openDlg($('#cardDlg'));
}

function applyViewerStyle(){
  const box=$('#sBox');
  const bBtn=$('#sBright');
  const zBtn=$('#sZoom');
  box.classList.toggle('bright',!!S.brightCard);
  box.classList.toggle('zoomed',!!S.zoomCard);
  bBtn.classList.toggle('on',!!S.brightCard);
  zBtn.classList.toggle('on',!!S.zoomCard);
}

function openCardViewer(id){
  const item=S.fuels.find(x=>x.id===id);
  if(!item)return;
  const hasNum=!!(item.number&&item.number.trim());
  const hasImg=!!item.image;
  if(!hasNum&&!hasImg){
    openCardEditor(id);
    return;
  }
  S.showFuelId=id;
  S.brightCard=true;
  S.zoomCard=false;
  applyViewerStyle();
  $('#sTitle').textContent=item.name;
  $('#sNote').textContent=item.note||'';
  const img=$('#sImg');
  if(hasImg){
    img.src=item.image;
    img.style.display='block';
  }else{
    img.removeAttribute('src');
    img.style.display='none';
  }
  $('#sBarcodeWrap').style.display=hasNum?'block':'none';
  $('#sNum').textContent=hasNum?item.number.trim():'';
  $('#sNum').style.display=hasNum?'block':'none';
  $('#sCopy').style.display=hasNum?'':'none';
  openDlg($('#showDlg'));
}

document.addEventListener('click',e=>{
  const t=e.target.closest('button,.fuel-tile');
  if(!t)return;
  const veh=getVeh();
  if(t.id==='tabSvc'){syncFormFromDom();S.tab='svc';render()}
  else if(t.id==='tabFuel'){syncFormFromDom();S.tab='fuel';render()}
  else if(t.dataset.switchVeh){
    syncFormFromDom();
    save();
    S.activeVehId=t.dataset.switchVeh;
    const nextVeh=getVeh();
    S.form.km=nextVeh.odo?String(nextVeh.odo):'';
    render();
    toast('Профил: '+nextVeh.name);
  }
  else if(t.id==='addVehBtn')openVehEditor(null);
  else if(t.id==='editVehBtn')openVehEditor(veh.id);
  else if(t.id==='vClearPhoto')setVehPhotoPreview('');
  else if(t.id==='vCancel')closeDlg($('#vehDlg'));
  else if(t.id==='vSave'){
    const name=$('#vName').value.trim()||'Ново МПС';
    const plate=$('#vPlate').value.trim().toUpperCase();
    const odo=Math.max(0,Number($('#vOdo').value)||0);
    const egn=$('#vEgn').value.trim();
    const regCert=$('#vRegCert').value.trim();
    const photo=S.editVehPhoto||'';
    if(S.editVehId){
      const existing=S.vehicles.find(v=>v.id===S.editVehId);
      if(existing){
        existing.name=name;existing.plate=plate;existing.odo=odo;existing.egn=egn;existing.regCert=regCert;existing.photo=photo;
      }
      S.activeVehId=existing.id;
    }else{
      const created=makeVehicle(name,plate,odo,photo);
      created.egn=egn;created.regCert=regCert;
      S.vehicles.push(created);
      S.activeVehId=created.id;
    }
    const cur=getVeh();
    S.form.km=cur.odo?String(cur.odo):'';
    save();closeDlg($('#vehDlg'));render();toast('Профилът е запазен.');
  }
  else if(t.id==='vDel'){
    if(!S.editVehId||S.vehicles.length<=1)return;
    S.vehicles=S.vehicles.filter(v=>v.id!==S.editVehId);
    S.activeVehId=S.vehicles[0].id;
    save();closeDlg($('#vehDlg'));render();toast('Профилът е изтрит.');
  }
  else if(t.id==='copyCheckInfo'){
    syncFormFromDom();
    save();
    const parts=[];
    if(veh.plate)parts.push('Рег. №: '+veh.plate);
    if(veh.egn)parts.push('ЕГН/Булстат: '+veh.egn);
    if(veh.regCert)parts.push('СРМПС: '+veh.regCert);
    const info=parts.join(' | ');
    if(info&&navigator.clipboard){
      navigator.clipboard.writeText(info).then(()=>toast('Данните за проверка са копирани.')).catch(()=>toast(info));
    }else{
      toast(info||'Няма въведени данни.');
    }
  }
  else if(t.dataset.pickType){
    syncFormFromDom();
    S.form.type=t.dataset.pickType;
    S.form.interval=Number(t.dataset.pickInt)||10000;
    S.form.months=Number(t.dataset.pickMonths)||12;
    if(!S.form.km&&veh.odo)S.form.km=String(veh.odo);
    render();
    window.scrollTo({top:0,behavior:'smooth'});
  }
  else if(t.id==='saveSvc'){
    syncFormFromDom();
    const km=Number(S.form.km)||Number(veh.odo)||0;
    const detail=S.form.detail.trim();
    const months=Number(S.form.months)||12;
    if(!detail&&!km)return toast('Въведи или снимай консуматив и километри.');
    if(km>veh.odo)veh.odo=km;
    veh.services.unshift({
      id:'s_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
      type:S.form.type,
      detail:detail||S.form.type,
      km,
      interval:Number(S.form.interval)||10000,
      months,
      date:S.form.date||new Date().toISOString().slice(0,10),
      note:S.form.note.trim()
    });
    S.form.detail='';
    S.form.note='';
    S.form.km=veh.odo?String(veh.odo):'';
    save();
    render();
    toast('Смяната е записана. Снимката не се пази и може да я изтриеш от галерията.');
  }
  else if(t.id==='addCalForm'){
    syncFormFromDom();
    const months=Number(S.form.months)||12;
    const targetDate=addMonthsIso(S.form.date,months);
    const km=Number(S.form.km)||Number(veh.odo)||0;
    const nextKm=km+(Number(S.form.interval)||10000);
    triggerCalendarReminder({
      title:`${S.form.type} — ${veh.name}`,
      desc:`Смяна на ${S.form.type}${S.form.detail?' ('+S.form.detail+')':''} на ${km.toLocaleString()} km. Следващ интервал: ~${nextKm.toLocaleString()} km или след ${months} мес.`,
      targetDate
    });
  }
  else if(t.dataset.calSvc){
    const s=(veh.services||[]).find(x=>x.id===t.dataset.calSvc);
    if(!s)return;
    const months=Number(s.months)||12;
    const targetDate=addMonthsIso(s.date,months);
    const nextKm=(Number(s.km)||0)+(Number(s.interval)||10000);
    triggerCalendarReminder({
      title:`${s.type} — ${veh.name}`,
      desc:`Последна смяна на ${Number(s.km||0).toLocaleString()} km (${s.detail||s.type}). Следваща смяна ориентировъчно на ${nextKm.toLocaleString()} km.`,
      targetDate
    });
  }
  else if(t.id==='clearForm'){
    S.form.detail='';S.form.note='';S.form.km=veh.odo?String(veh.odo):'';
    render();
  }
  else if(t.dataset.delSvc){
    veh.services=(veh.services||[]).filter(x=>x.id!==t.dataset.delSvc);
    save();render();toast('Записът е изтрит.');
  }
  else if(t.id==='addFuel')openCardEditor(null);
  else if(t.dataset.openFuel)openCardViewer(t.dataset.openFuel);
  else if(t.id==='cClearImg')setCardEditorPreview('');
  else if(t.id==='cCancel')closeDlg($('#cardDlg'));
  else if(t.id==='cSave'){
    const name=$('#cName').value.trim();
    const number=$('#cNum').value.trim();
    const note=$('#cNote').value.trim();
    const image=S.editFuelImage||'';
    if(!name)return toast('Въведи име на обекта / веригата.');
    if(S.editFuelId){
      const f=S.fuels.find(x=>x.id===S.editFuelId);
      if(f){f.name=name;f.number=number;f.note=note;f.image=image}
    }else{
      S.fuels.push({id:'f_'+Date.now(),name,number,note,image});
    }
    save();closeDlg($('#cardDlg'));render();toast('Картата е запазена.');
  }
  else if(t.id==='cDel'){
    if(!S.editFuelId)return;
    S.fuels=S.fuels.filter(x=>x.id!==S.editFuelId);
    save();closeDlg($('#cardDlg'));render();toast('Картата е премахната.');
  }
  else if(t.id==='sZoom'){
    S.zoomCard=!S.zoomCard;
    applyViewerStyle();
  }
  else if(t.id==='sBright'){
    S.brightCard=!S.brightCard;
    applyViewerStyle();
  }
  else if(t.id==='sClose')closeDlg($('#showDlg'));
  else if(t.id==='sEdit'){closeDlg($('#showDlg'));openCardEditor(S.showFuelId)}
  else if(t.id==='sCopy'){
    const txt=$('#sNum').textContent||'';
    if(txt&&navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast('Номерът е копиран.')).catch(()=>toast(txt));
  }
  else if(t.id==='btnExport'){
    syncFormFromDom();
    const blob=new Blob([JSON.stringify({activeVehId:S.activeVehId,vehicles:S.vehicles,fuels:S.fuels},null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='garage-fuel-backup.json';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  }
});

document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.ocr){
    syncFormFromDom();
    const f=t.files&&t.files[0];
    t.value='';
    readImage(f,t.dataset.ocr);
  }else if(t.id==='cOcrFile'){
    const f=t.files&&t.files[0];
    t.value='';
    readImage(f,'card');
  }else if(t.id==='cImgFile'){
    const f=t.files&&t.files[0];
    t.value='';
    if(!f)return;
    try{
      const compressed=await compressImage(f,1400,0.86);
      setCardEditorPreview(compressed);
      toast('Снимката на картата е добавена.');
    }catch(err){
      toast('Неуспешно зареждане на снимката.');
    }
  }else if(t.id==='vPhotoFile'){
    const f=t.files&&t.files[0];
    t.value='';
    if(!f)return;
    try{
      const compressed=await compressImage(f,1000,0.82);
      setVehPhotoPreview(compressed);
      toast('Снимката на превозното средство е добавена.');
    }catch(err){
      toast('Неуспешно зареждане на снимката.');
    }
  }else if(t.id==='fileImport'){
    const f=t.files&&t.files[0];
    t.value='';
    if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{
      try{
        const d=JSON.parse(String(ev.target.result||''));
        if(Array.isArray(d.vehicles)&&d.vehicles.length){
          S.vehicles=d.vehicles.map(v=>({
            id:v.id||('v_'+Math.random().toString(36).slice(2,6)),
            name:v.name||'Основно МПС',
            plate:v.plate||'',
            odo:Number(v.odo)||0,
            egn:v.egn||'',
            regCert:v.regCert||'',
            photo:v.photo||'',
            services:Array.isArray(v.services)?v.services:[]
          }));
          S.activeVehId=d.activeVehId&&S.vehicles.some(v=>v.id===d.activeVehId)?d.activeVehId:S.vehicles[0].id;
        }
        if(Array.isArray(d.fuels)&&d.fuels.length){
          S.fuels=d.fuels.map(x=>({id:x.id||('f_'+Math.random()),name:x.name||'',number:x.number||'',note:x.note||'',image:x.image||''}));
        }
        const cur=getVeh();
        S.form.km=cur.odo?String(cur.odo):'';
        save();render();toast('Данните са възстановени.');
      }catch(err){toast('Невалиден JSON файл.')}
    };
    r.readAsText(f);
  }else if(t.id==='vehInput'||t.id==='plateInput'||t.id==='odoInput'||t.id==='egnInput'||t.id==='regCertInput'||t.id==='fType'||t.id==='fKm'||t.id==='fInt'||t.id==='fMonths'||t.id==='fDate'){
    syncFormFromDom();
    if(t.id==='vehInput'||t.id==='plateInput'||t.id==='odoInput'||t.id==='egnInput'||t.id==='regCertInput')save();
    if(t.id==='fType'||t.id==='fDate'||t.id==='fMonths')render();
  }
});

load();
render();
if('serviceWorker'in navigator&&location.protocol.startsWith('http')){
  addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
})();
</script>
</body>
</html>
